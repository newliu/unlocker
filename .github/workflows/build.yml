name: Build Hodor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 使用这个 Action 自动注入 vcvarsall.bat 的环境变量
    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Run build script
      shell: cmd
      run: build.bat

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hodor-build
        path: |
          UnlockProvider.dll
          test_unlock.exe
