name: Build Hodor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 这一步是关键：使用微软官方的开发者命令提示符环境来运行 build.bat
    - name: Run build script in Developer Command Prompt
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
        build.bat

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hodor-build
        path: |
          UnlockProvider.dll
          test_unlock.exe
