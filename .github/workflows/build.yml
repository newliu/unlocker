name: Build Hodor

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # 使用官方 Action 配置 MSBuild 和 VS 环境
    - name: Setup MSBuild and VS Environment
      uses: microsoft/setup-msbuild@v2

    # 直接运行构建脚本，此时环境变量已经包含了 VS 的路径
    - name: Run build script
      shell: cmd
      run: build.bat

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hodor-build
        path: |
          UnlockProvider.dll
          test_unlock.exe
