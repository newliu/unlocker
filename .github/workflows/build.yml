name: Build Hodor

on:
  push:
    branches: [ "main" ] # 如果你默认分支是 master，请改成 master
  workflow_dispatch: # 允许你在 Actions 页面手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Run build script
      shell: cmd
      run: build.bat

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hodor-build
        path: |
          UnlockProvider.dll
          test_unlock.exe
